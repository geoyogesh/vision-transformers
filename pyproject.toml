[project]
name = "vision-transformers"
version = "0.1.0"
description = "Minimal Vision Transformer (ViT) from scratch in PyTorch, trained on MNIST"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pillow==13.0.0",
]

[project.scripts]
vit-train = "vit.train:main"
vit-infer = "vit.infer:main"

[dependency-groups]
notebook = [
    "jupyterlab==4.6.4",
    "notebook==7.6.3",
    "matplotlib==3.11.2",
    "torchinfo==1.8.0",
    "torchview==0.2.7",
    "graphviz==0.21",
]
dev = [
    "nbstripout==0.9.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is owned by `ruff format`
ignore = ["E501"]

[tool.ruff.format]
# Keep the tutorial notebook's code as written; it is still linted
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# The tutorial notebook imports incrementally and uses notebook-style globals
"notebooks/*.ipynb" = ["E402", "F401", "I001", "B007"]
