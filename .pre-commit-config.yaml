# Hooks run the tool versions pinned in uv.lock (no separate hook downloads).
# Install once per clone: make hooks
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, jupyter]
      - id: nbstripout
        name: strip notebook outputs
        entry: uv run nbstripout
        language: system
        files: \.ipynb$
      - id: large-files
        name: block files over 500 KB
        entry: uv run python scripts/check_large_files.py
        language: system
